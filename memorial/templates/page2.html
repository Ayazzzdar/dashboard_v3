<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>This Day in History</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page { padding-bottom: 150px; }
  h1 { margin-top: 128px; font-size: 104px; font-weight: 400; letter-spacing: .05em; line-height: 1.04; text-align: center; }
  .date { margin-top: 22px; font-family: var(--book); font-weight: 500; font-size: 50px; letter-spacing: .06em; }
  .date sup { font-size: .55em; }
  .ornrule { margin-top: 30px; }

  .timeline { width: 1120px; flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
  .entry { display: grid; grid-template-columns: 300px 60px 1fr; align-items: center; min-height: 250px; }
  .year { font-size: 108px; line-height: 1; text-align: right; padding-right: 6px; }
  .spine { align-self: stretch; display: flex; flex-direction: column; align-items: center; }
  .spine::before, .spine::after { content: ""; flex: 1; border-left: 1.25px solid var(--rule); }
  .spine i { width: 13px; height: 13px; border: 1.5px solid var(--rule); transform: rotate(45deg); margin: 10px 0; }
  .text { font-family: var(--book); font-size: 36px; line-height: 1.42; padding-left: 18px; }

  .vignette { display: flex; align-items: center; gap: 26px; }
  .vignette::before, .vignette::after { content: ""; width: 200px; border-top: 1px solid var(--rule); }
  .vignette img { width: 110px; height: 120px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="page">
    <h1>THIS DAY<br>IN HISTORY</h1>
    <div class="date">{{P2_DATE}}</div>
    <div class="ornrule"><i></i></div>

    <div class="timeline">
      <div class="entry">
        <div class="year lining">{{YEAR1}}</div><div class="spine"><i></i></div>
        <div class="text">{{EVENT1}}</div>
      </div>
      <div class="entry">
        <div class="year lining">{{YEAR2}}</div><div class="spine"><i></i></div>
        <div class="text">{{EVENT2}}</div>
      </div>
      <div class="entry">
        <div class="year lining">{{YEAR3}}</div><div class="spine"><i></i></div>
        <div class="text">{{EVENT3}}</div>
      </div>
      <div class="entry">
        <div class="year lining">{{YEAR4}}</div><div class="spine"><i></i></div>
        <div class="text">{{EVENT4}}</div>
      </div>
    </div>

    <div class="vignette"><img class="ico" src="assets/quill.png" alt=""></div>
  </div>
</body>
</html>
