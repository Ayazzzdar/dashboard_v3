<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A Cultural Snapshot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .page { padding-bottom: 140px; }
  h1 { margin-top: 124px; font-size: 96px; font-weight: 400; letter-spacing: .05em; line-height: 1.04; text-align: center; }
  .yr { margin-top: 26px; display: flex; align-items: center; gap: 22px; }
  .yr::before, .yr::after { content: ""; width: 120px; border-top: 1.25px solid var(--rule); }
  .yr .box { padding: 10px 46px 12px; font-size: 68px; line-height: 1; border-radius: 0; }
  .ornrule { margin-top: 30px; }

  .rows { width: 1120px; flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
  .row { display: grid; grid-template-columns: 230px 1fr; column-gap: 46px; align-items: center; padding: 6px 0; }
  .row + .row { border-top: .75px solid rgba(42,38,34,.45); }
  .row .art { height: 196px; display: flex; align-items: center; justify-content: center; }
  .row .art img { max-width: 236px; max-height: 196px; }
  .row .cap { font-size: 26px; }
  .row .what { font-size: 46px; font-style: italic; line-height: 1.15; margin-top: 6px; }
  .row .why { font-family: var(--book); font-size: 30px; line-height: 1.35; margin-top: 8px; color: #2e2a25; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="page">
    <h1>A CULTURAL<br>SNAPSHOT OF</h1>
    <div class="yr"><div class="box lining">{{YEAR}}</div></div>
    <div class="ornrule"><i></i></div>

    <div class="rows">
      <div class="row">
        <div class="art"><img class="ico" src="assets/books.png" alt=""></div>
        <div>
          <div class="cap">Top Selling Book</div>
          <div class="what">{{BOOK}}</div>
          <div class="why">{{BOOK_DESC}}</div>
        </div>
      </div>
      <div class="row">
        <div class="art"><img class="ico" src="assets/tv.png" alt=""></div>
        <div>
          <div class="cap">TV Highlights</div>
          <div class="what">{{TV}}</div>
          <div class="why">{{TV_DESC}}</div>
        </div>
      </div>
      <div class="row">
        <div class="art"><img class="ico" src="assets/mannequin.png" alt=""></div>
        <div>
          <div class="cap">Fashion Trend</div>
          <div class="what">{{FASHION}}</div>
          <div class="why">{{FASHION_DESC}}</div>
        </div>
      </div>
      <div class="row">
        <div class="art"><img class="ico" src="assets/bulb.png" alt=""></div>
        <div>
          <div class="cap">Technology</div>
          <div class="what">{{TECH}}</div>
          <div class="why">{{TECH_DESC}}</div>
        </div>
      </div>
      <div class="row">
        <div class="art"><img class="ico" src="assets/pram.png" alt=""></div>
        <div>
          <div class="cap">AU Births</div>
          <div class="what lining">{{BIRTHS}}</div>
          <div class="why">{{BIRTHS_DESC}}</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
