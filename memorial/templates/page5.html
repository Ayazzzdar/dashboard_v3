<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>A Life in Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3eee2;
    --ink: #1b1815;
    --soft: #5b544a;
    --rule: #2a2622;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1414px; height: 2000px; background: var(--paper); }
  body {
    position: relative;
    color: var(--ink);
    font-family: 'Playfair Display', serif;
    overflow: hidden;
  }

  /* subtle paper grain */
  body::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.35), transparent 70%),
      radial-gradient(ellipse at 50% 100%, rgba(120,100,70,.08), transparent 60%);
    pointer-events: none;
  }

  /* double-rule frame */
  .frame { position: absolute; inset: 56px; border: 1.5px solid var(--rule); }
  .frame::after { content: ""; position: absolute; inset: 9px; border: .75px solid var(--rule); }

  .corner { position: absolute; width: 250px; height: 250px; background: url(assets/corner.png) no-repeat top left / contain; }
  .tl { top: 40px; left: 40px; }
  .tr { top: 40px; right: 40px; transform: scaleX(-1); }
  .bl { bottom: 40px; left: 40px; transform: scaleY(-1); }
  .br { bottom: 40px; right: 40px; transform: scale(-1,-1); }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }

  h1 {
    margin-top: 124px;
    font-weight: 400;
    font-size: 104px;
    letter-spacing: .06em;
    line-height: 1;
  }
  .dates {
    margin-top: 26px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 50px;
    letter-spacing: .12em;
    font-variant-numeric: oldstyle-nums;
  }

  /* rule with a centred diamond */
  .ornrule { display: flex; align-items: center; gap: 18px; width: 1120px; margin-top: 30px; }
  .ornrule::before, .ornrule::after { content: ""; flex: 1; border-top: 1.5px solid var(--rule); }
  .ornrule i { width: 11px; height: 11px; border: 1.5px solid var(--rule); transform: rotate(45deg); }
  .ornrule.short { width: 520px; margin-top: 0; }

  .tagline {
    margin-top: 26px;
    font-style: italic;
    font-size: 38px;
    color: var(--soft);
  }

  .sunrise { margin-top: 18px; height: 168px; }

  .hero {
    margin-top: 0;
    font-variant-numeric: lining-nums;
    font-size: 190px;
    font-weight: 400;
    line-height: .95;
    letter-spacing: -.01em;
  }
  .hero-label {
    margin-top: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 38px;
    letter-spacing: .32em;
    padding-left: .32em;
  }

  .grid {
    margin-top: 48px;
    display: grid;
    grid-template-columns: 520px 520px;
    gap: 34px;
  }
  .card {
    position: relative;
    height: 436px;
    border: 1.25px solid var(--rule);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 40px;
  }
  .card::after { content: ""; position: absolute; inset: 7px; border: .6px solid var(--rule); pointer-events: none; }
  .card .ico { height: 168px; display: flex; align-items: center; justify-content: center; }
  .card .ico img { max-height: 168px; max-width: 220px; }
  .card .num {
    margin-top: 26px;
    font-variant-numeric: lining-nums;
    font-size: 96px;
    line-height: 1;
    font-weight: 400;
  }
  .card .num small { font-size: .62em; font-style: italic; margin-left: .28em; }
  .card .lbl {
    margin-top: 30px;
    display: flex; align-items: center; gap: 16px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 27px;
    letter-spacing: .28em;
    padding-left: .28em;
  }
  .card .lbl::before, .card .lbl::after { content: ""; width: 34px; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

  <div class="page">
    <h1>A LIFE IN NUMBERS</h1>
    <div class="dates">{{LIFESPAN}}</div>
    <div class="ornrule"><i></i></div>
    <div class="tagline">A life beautifully lived</div>
    <img class="sunrise" src="assets/sunrise.png" alt="">
    <div class="hero">{{DAYS}}</div>
    <div class="hero-label">DAYS OF LIFE</div>

    <div class="grid">
      <div class="card">
        <div class="ico"><img src="assets/sun.png" alt=""></div>
        <div class="num">{{YEARS}}</div>
        <div class="lbl">YEARS</div>
      </div>
      <div class="card">
        <div class="ico"><img src="assets/hourglass.png" alt=""></div>
        <div class="num">{{WEEKS}}</div>
        <div class="lbl">WEEKS</div>
      </div>
      <div class="card">
        <div class="ico"><img src="assets/moon.png" alt=""></div>
        <div class="num">{{MOONS}}</div>
        <div class="lbl">FULL MOONS</div>
      </div>
      <div class="card">
        <div class="ico"><img src="assets/heart.png" alt=""></div>
        <div class="num">{{HEARTBEATS}}<small>billion</small></div>
        <div class="lbl">HEARTBEATS</div>
      </div>
    </div>
  </div>
</body>
</html>
